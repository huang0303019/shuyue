name: Build ShuYue

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Run engine unit tests
        run: |
          set -o pipefail
          xcodegen generate --spec project.yml
          DEVICE="$(xcrun simctl list devices available | grep -o 'iPhone [0-9]*' | head -1 || echo 'iPhone 16')"
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project ShuYue.xcodeproj \
            -scheme ShuYue \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/DerivedDataTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log
          echo "--- test summary ---"
          grep -E "Test Suite '(SYEngineTests|All tests)'" build/test.log || true

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_ipa.sh
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/build_ipa.sh "$VERSION"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShuYue-unsigned-ipa
          path: build/ShuYue-*.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ShuYue-*.ipa
          generate_release_notes: true