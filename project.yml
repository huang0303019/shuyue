name: ShuYue
options:
  bundleIdPrefix: com.zhong228
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  ShuYue:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Design
      - path: Features
      - path: Resources
      - path: Engine
    dependencies:
      - target: ShuYueShare
        embed: true
    settings:
      base:
        PRODUCT_NAME: ShuYue
        PRODUCT_BUNDLE_IDENTIFIER: com.zhong228.shuyue
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

  ShuYueShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_NAME: ShuYueShare
        PRODUCT_BUNDLE_IDENTIFIER: com.zhong228.shuyue.share
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  EngineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EngineTests
    dependencies:
      - target: ShuYue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhong228.shuyue.engine-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ShuYue.app/ShuYue
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ShuYue:
    build:
      targets:
        ShuYue: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EngineTests
    archive:
      config: Release